<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dumb Chess - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900">
    <div class="main-content">
        <div class="text-center">
            <!-- Chess King Icon -->
           
            
            <!-- Main Title -->
            <h1 class="text-[150px] md:text-9xl font-bold text-white mb-8 tracking-wider leading-none">
                Dumb Chess
            </h1>

            <div class="w-32 h-64 relative mx-auto mb-8">
                <div class="absolute w-[540px] h-[550px] -bottom-28 left-1/2 transform -translate-x-1/2">
                    <img class="w-full h-full" src="img/chessdumb.png" alt="Chess King" style="object-fit: contain;">
                </div>
                
            </div>
            
            <!-- Play Buttons -->
            <div class="space-y-4">
                <button id="playOnlineBtn"
                   class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-bold text-xl py-3 px-8 rounded-lg shadow-lg transform hover:scale-105 transition-all duration-200 ease-in-out">
                    Play Online
                </button>
                <!--
                <br>
                <a href="game.html" 
                   class="inline-block bg-red-600 hover:bg-red-700 text-white font-bold text-xl py-3 px-8 rounded-lg shadow-lg transform hover:scale-105 transition-all duration-200 ease-in-out">
                    Play Local
                </a>
                -->
            </div>
            
            <!-- Join Game with ID Section -->
            <div class="mt-8 bg-gray-800 bg-opacity-50 backdrop-blur-sm rounded-lg p-6 max-w-md mx-auto">
                <h3 class="text-white text-lg font-semibold mb-4 text-center">Join Game with ID</h3>
                <div class="space-y-3">
                    <input type="text" id="gameIdInput" 
                           class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500" 
                           placeholder="Enter Game ID">
                    <button id="joinGameBtn" 
                            class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded-lg shadow-lg transform hover:scale-105 transition-all duration-200 ease-in-out">
                        Join Game
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Player Name Dialog -->
    <div id="nameDialog" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg p-6 max-w-sm w-full mx-4">
            <h3 class="text-lg font-semibold mb-4 text-center">Enter Your Name</h3>
            <input type="text" id="playerNameInput" 
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4" 
                   placeholder="Your name" maxlength="20">
            <div class="flex space-x-2">
                <button id="cancelNameBtn" 
                        class="flex-1 bg-gray-500 hover:bg-gray-600 text-white font-medium py-2 px-4 rounded-lg">
                    Cancel
                </button>
                <button id="confirmNameBtn" 
                        class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg">
                    Continue
                </button>
            </div>
        </div>
    </div>

    <script>
        let pendingAction = null;
        let pendingGameId = null;

        document.getElementById('playOnlineBtn').addEventListener('click', () => {
            pendingAction = 'random';
            showNameDialog();
        });

        document.getElementById('joinGameBtn').addEventListener('click', () => {
            const gameId = document.getElementById('gameIdInput').value.trim();
            if (!gameId) {
                alert('Please enter a Game ID');
                return;
            }
            pendingAction = 'join';
            pendingGameId = gameId;
            showNameDialog();
        });

        document.getElementById('cancelNameBtn').addEventListener('click', () => {
            hideNameDialog();
            pendingAction = null;
            pendingGameId = null;
        });

        document.getElementById('confirmNameBtn').addEventListener('click', () => {
            const playerName = document.getElementById('playerNameInput').value.trim();
            if (!playerName) {
                alert('Please enter your name');
                return;
            }
            
            hideNameDialog();
            
            // Redirect to game page with player name and appropriate action
            if (pendingAction === 'random') {
                window.location.href = `game-simple.html?action=random&name=${encodeURIComponent(playerName)}`;
            } else if (pendingAction === 'join' && pendingGameId) {
                window.location.href = `game-simple.html?action=join&name=${encodeURIComponent(playerName)}&gameId=${encodeURIComponent(pendingGameId)}`;
            }

        });

        document.getElementById('playerNameInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('confirmNameBtn').click();
            }
        });

        function showNameDialog() {
            document.getElementById('nameDialog').classList.remove('hidden');
            document.getElementById('playerNameInput').focus();
        }

        function hideNameDialog() {
            document.getElementById('nameDialog').classList.add('hidden');
            document.getElementById('playerNameInput').value = '';
        }
    </script>
</body>

</html>
