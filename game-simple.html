<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dumb Chess - Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./css/chessboard-1.0.0.min.css">
    <script src="./js/jquery-3.7.1.min.js"></script>
    <script src="./js/chessboard-1.0.0.min.js"></script>
    <script src="./js/chess.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        #board {
            max-width: 600px;
            position: relative;
        }
        
        .profile-pic {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(45deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
        }
        
        .profile-pic.white {
            background: linear-gradient(45deg, #f093fb 0%, #f5576c 100%);
        }
        
        .profile-pic.black {
            background: linear-gradient(45deg, #4facfe 0%, #00f2fe 100%);
        }
        
        .connection-dialog {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .connection-content {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
        }
        
        .hidden {
            display: none !important;
        }
        
        .chat-container {
            max-height: 200px;
            overflow-y: auto;
        }
        
        .chat-message {
            margin-bottom: 0.5rem;
            padding: 0.5rem;
            background: #f3f4f6;
            border-radius: 6px;
        }
        
        .chat-message.own {
            background: #dbeafe;
            text-align: right;
        }
    </style>
</head>

<body class="bg-gray-100">
    <!-- Connection Dialog -->
    <div id="connectionDialog" class="connection-dialog">
        <div class="connection-content">
            <h2 class="text-2xl font-bold text-center mb-6">Join Chess Game</h2>
            
            <div class="mb-4">
                <label for="playerName" class="block text-sm font-medium text-gray-700 mb-2">Your Name</label>
                <input type="text" id="playerName" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter your name" maxlength="20">
            </div>
            
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">Game Options</label>
                <div class="space-y-3">
                    <button id="connectBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-md transition-colors">
                        Find Random Game
                    </button>
                    <button id="createGameBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-4 rounded-md transition-colors">
                        Create New Game
                    </button>
                </div>
                
                <div class="mt-4 pt-4 border-t border-gray-200">
                    <div class="mb-2">
                        <label for="gameId" class="block text-sm font-medium text-gray-700 mb-2">Or join with Game ID</label>
                        <input type="text" id="gameId" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter game ID">
                    </div>
                    <button id="joinGameBtn" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-medium py-2 px-4 rounded-md transition-colors">
                        Join Game
                    </button>
                </div>
            </div>
            
            <div id="connectionStatus" class="text-center text-sm text-gray-600">
                <div class="flex items-center justify-center">
                    <div class="w-3 h-3 bg-gray-400 rounded-full mr-2"></div>
                    Disconnected
                </div>
            </div>
        </div>
    </div>

    <!-- Main Game Layout -->
    <div class="max-w-7xl mx-auto px-4 py-6">
        <!-- Header -->
        <div class="text-center mb-6">
            <a href="index.html" class="inline-flex items-center text-gray-700 hover:text-gray-900">
                <div class="w-12 h-12 bg-gray-800 rounded-full flex items-center justify-center mr-3">
                    <span class="text-white text-xl font-bold">♔</span>
                </div>
                <h1 class="text-2xl font-bold">DumbChess Online</h1>
            </a>
        </div>

        <div class="flex flex-col lg:flex-row justify-center gap-8">
            <!-- Game Board -->
            <div class="lg:w-2/3 flex flex-col items-center">
                <!-- Black Player (Top) -->
                <div class="flex flex-row gap-4 w-full max-w-2xl items-center justify-between mb-4">
                    <div class="flex items-center gap-3">
                        <div id="blackProfilePic" class="profile-pic black">B</div>
                        <div>
                            <div id="blackPlayerName" class="font-semibold text-gray-800">Black Player</div>
                            <div class="text-sm text-gray-500">Waiting...</div>
                        </div>
                    </div>
                    <div class="bg-gray-200 rounded-lg py-3 px-6">
                        <div id="black-timer" class="text-2xl font-mono font-bold">10:00</div>
                    </div>
                </div>
                
                <!-- Chess Board -->
                <div id="board" class="w-full max-w-2xl mb-4"></div>
                
                <!-- White Player (Bottom) -->
                <div class="flex flex-row gap-4 w-full max-w-2xl items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div id="whiteProfilePic" class="profile-pic white">W</div>
                        <div>
                            <div id="whitePlayerName" class="font-semibold text-gray-800">White Player</div>
                            <div class="text-sm text-gray-500">Waiting...</div>
                        </div>
                    </div>
                    <div class="bg-gray-200 rounded-lg py-3 px-6">
                        <div id="white-timer" class="text-2xl font-mono font-bold">10:00</div>
                    </div>
                </div>
                
                <!-- Game Status -->
                <div class="w-full max-w-2xl bg-white p-4 rounded-lg shadow-sm mt-4">
                    <div id="game-status" class="text-center text-gray-600">Connecting...</div>
                </div>
            </div>
            
            <!-- Side Panel -->
            <div class="lg:w-1/3 max-w-md">
                <!-- Game Controls -->
                <div class="bg-white rounded-lg shadow-sm p-4 mb-4">
                    <h3 class="font-semibold text-gray-800 mb-3">Game Controls</h3>
                    <div class="space-y-2">
                        <button id="readyBtn" class="w-full bg-gray-400 text-white font-medium py-2 px-4 rounded-md transition-colors" disabled>
                            Waiting for Game Start
                        </button>
                        <button id="resignBtn" class="w-full bg-red-600 hover:bg-red-700 text-white font-medium py-2 px-4 rounded-md transition-colors" disabled>
                            Resign
                        </button>
                    </div>
                </div>
                
                <!-- Chat -->
                <div class="bg-white rounded-lg shadow-sm p-4">
                    <h3 class="font-semibold text-gray-800 mb-3">Chat</h3>
                    <div id="chatMessages" class="chat-container mb-3">
                        <div class="chat-message text-center text-gray-500 text-sm">
                            Chat will appear here when you join a game
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <input type="text" id="chatInput" class="flex-1 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Type a message..." disabled>
                        <button id="sendChatBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md transition-colors" disabled>
                            Send
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Game Script -->
    <script src="game-simple.js"></script>
</body>

</html>
