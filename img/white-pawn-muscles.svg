<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="768" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">White Pawn with Muscles</title>
  <desc id="desc">A stylized white chess pawn with flexing muscular arms. Transparent background, clean vector.</desc>
  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e5e7eb" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="gloss" cx="35%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Pawn base shadow (subtle) -->
  <ellipse cx="256" cy="412" rx="130" ry="26" fill="#0f172a" opacity="0.10"/>

  <!-- Arms group behind the body -->
  <g id="arms" filter="url(#softShadow)">
    <!-- Left arm (flex) -->
    <path d="M134 254
             c-28 -10 -44 -36 -39 -64
             c4 -21 17 -36 38 -43
             c20 -7 43 -2 58 12
             c6 6 9 14 7 22
             c-2 7 -7 12 -14 15
             c-12 5 -20 8 -26 15
             c-6 7 -7 16 -2 25
             c6 10 17 16 32 17
             c10 0 18 8 18 18
             c0 9 -7 17 -16 18
             c-18 2 -36 -1 -56 -13z"
          fill="url(#shine)" stroke="#cbd5e1" stroke-width="4"/>
    <!-- Left forearm+fist -->
    <path d="M162 242
             c10 -8 20 -11 30 -10
             c12 1 21 10 23 22
             c2 12 -4 23 -16 28
             c-10 4 -22 4 -35 -2
             c-9 -4 -13 -15 -9 -24
             c2 -6 4 -10 7 -14z"
          fill="url(#shine)" stroke="#cbd5e1" stroke-width="4"/>

    <!-- Right arm (mirror flex) -->
    <path d="M378 254
             c28 -10 44 -36 39 -64
             c-4 -21 -17 -36 -38 -43
             c-20 -7 -43 -2 -58 12
             c-6 6 -9 14 -7 22
             c2 7 7 12 14 15
             c12 5 20 8 26 15
             c6 7 7 16 2 25
             c-6 10 -17 16 -32 17
             c-10 0 -18 8 -18 18
             c0 9 7 17 16 18
             c18 2 36 -1 56 -13z"
          fill="url(#shine)" stroke="#cbd5e1" stroke-width="4"/>
    <!-- Right forearm+fist -->
    <path d="M350 242
             c-10 -8 -20 -11 -30 -10
             c-12 1 -21 10 -23 22
             c-2 12 4 23 16 28
             c10 4 22 4 35 -2
             c9 -4 13 -15 9 -24
             c-2 -6 -4 -10 -7 -14z"
          fill="url(#shine)" stroke="#cbd5e1" stroke-width="4"/>
  </g>

  <!-- Pawn body -->
  <g id="pawn" filter="url(#softShadow)">
    <!-- Head -->
    <circle cx="256" cy="150" r="44" fill="url(#shine)" stroke="#cbd5e1" stroke-width="4"/>
    <!-- Neck / Collar -->
    <path d="M210 198
             h92
             c8 0 14 6 14 14
             v8
             c0 8 -6 14 -14 14
             h-92
             c-8 0 -14 -6 -14 -14
             v-8
             c0 -8 6 -14 14 -14z"
          fill="url(#shine)" stroke="#cbd5e1" stroke-width="4"/>
    <!-- Torso (bulb) -->
    <path d="M160 236
             c0 0 -10 64 40 110
             c32 31 56 38 56 38
             s24 -7 56 -38
             c50 -46 40 -110 40 -110
             c-32 -16 -88 -18 -96 -18
             c-8 0 -64 2 -96 18z"
          fill="url(#shine)" stroke="#cbd5e1" stroke-width="4"/>
    <!-- Base ring -->
    <path d="M128 388
             c0 -12 10 -22 22 -22
             h212
             c12 0 22 10 22 22
             v6
             c0 12 -10 22 -22 22
             h-212
             c-12 0 -22 -10 -22 -22
             z"
          fill="url(#shine)" stroke="#cbd5e1" stroke-width="4"/>
    <!-- Foot / bottom plate -->
    <rect x="120" y="416" width="272" height="16" rx="8" fill="url(#shine)" stroke="#cbd5e1" stroke-width="4"/>
    <!-- Gloss highlight -->
    <ellipse cx="228" cy="208" rx="60" ry="24" fill="url(#gloss)"/>
  </g>
</svg>
