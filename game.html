<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dumb Chess - Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./css/chessboard-1.0.0.min.css">
    <script src="./js/jquery-3.7.1.min.js"></script>
    <script src="./js/chessboard-1.0.0.min.js"></script>
    <script src="./js/chess.min.js"></script>
    <style>
        #board {
            max-width: 600px;
            position: relative;
        }
        #score-bar-container {
            position: absolute;
            left: 75px;
            top: 0;
            width: 10px;
            height: 100%;
            background-color: #3b4252ff;
        }
        #score-bar {
            position: absolute;
            bottom: 0;
            width: 100%;
            background-color: #d8dee9ff;
        }
        
    </style>
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <a href="index.html" class="block text-center">
            <div class="w-20 h-20 mx-auto mb-3 bg-gray-800 rounded-full flex items-center justify-center">
                <span class="text-white text-2xl font-bold">♔</span>
            </div>
            <h1 class="text-3xl font-bold text-gray-900 pb-3">DumbChess</h1>
        </a>
    </div>
</head>

<body>
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-center">
            <div class="flex flex-col items-center w-full">
                
                <div class="flex flex-row gap-2 w-full max-w-2xl px-10 mb-4 justify-between">
                    <div class="flex flex-row gap-2 items-center">
                        <div class="w-10 h-10 bg-gray-800 rounded-md"></div>
                        <div id="name">Name</div>
                    </div>
                    <div class="my-auto bg-gray-200 rounded-md py-2 px-4">
                        <div id="black-timer" class="my-auto text-xl">00:00</div>
                    </div>
                </div>
                
                <div id="board" class="w-full max-w-screen-lg"></div>
                <div class="flex flex-row gap-2 w-full max-w-2xl px-10 my-4 justify-between">
                    <div class="flex flex-row gap-2 items-center">
                        <div class="w-10 h-10 bg-gray-800 rounded-md"></div>
                        <div id="name">Name</div>
                    </div>
                    <div class="my-auto bg-gray-200 rounded-md py-2 px-4">
                        <div id="white-timer" class="my-auto text-xl">00:00</div>
                    </div>
                </div>
                <div class="w-full max-w-2xl bg-gray-100 p-2 rounded" id="game-result"><span id="game-score"></span></div>
                
            </div>
        </div>
    </div>
    <!-- Footer -->
    <script src="index-simple.js"></script>
</body>

</html>
